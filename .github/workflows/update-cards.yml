name: Update README cards

on:
  schedule:
    - cron: "0 3 * * *" # once a day
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      # STATS_TOKEN is a personal access token (scopes: repo, read:user) so that
      # private repositories are counted. Without it, only public data is used.
      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: "username=AmmarDalel&include_all_commits=true&count_private=true&show_icons=true&hide_rank=true&hide=stars,issues,contribs&hide_border=true&bg_color=0B1530&title_color=3B9DFF&icon_color=1E90FF&text_color=E2E8F0"
          path: profile/stats.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: "true"

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: "username=AmmarDalel&layout=compact&langs_count=6&hide_border=true&bg_color=0B1530&title_color=3B9DFF&text_color=E2E8F0"
          path: profile/top-langs.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: "true"

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
