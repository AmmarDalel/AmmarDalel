<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Dalel Ammar, Full-Stack Software Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#111a33"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.85" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.7" cy="1.1" r="0.55">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.16"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="1"/>
    </linearGradient>
    <mask id="dotMask">
      <rect width="1200" height="300" fill="url(#fade)"/>
    </mask>
    <clipPath id="card">
      <rect width="1200" height="300" rx="20"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#glowA)"/>
    <rect width="1200" height="300" fill="url(#glowB)"/>
    <rect width="1200" height="300" fill="url(#dots)" mask="url(#dotMask)"/>

    <g fill="none" stroke="#ffffff" stroke-opacity="0.10">
      <circle cx="1030" cy="150" r="70"/>
      <circle cx="1030" cy="150" r="120"/>
      <circle cx="1030" cy="150" r="170"/>
    </g>
    <text x="1030" y="166" text-anchor="middle" font-family="Consolas, 'SFMono-Regular', Menlo, monospace" font-size="46" font-weight="700" fill="#ffffff" fill-opacity="0.85">&lt;/&gt;</text>
  </g>

  <rect x="72" y="76" width="56" height="4" rx="2" fill="url(#accent)"/>

  <text x="72" y="116" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" letter-spacing="4" fill="#67e8f9">FULL-STACK SOFTWARE ENGINEER</text>

  <text x="70" y="186" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="68" font-weight="700" fill="#ffffff">Dalel Ammar</text>

  <text x="72" y="234" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#cbd5e1">TypeScript  ·  React / Next.js  ·  NestJS  ·  PostgreSQL</text>
</svg>
